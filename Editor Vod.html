<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator M3U Film</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-5 md:p-8 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold tracking-tight text-amber-400">Generator & Editor M3U</h1>
            <p class="text-sm text-slate-400 mt-1">Tambah film, logo, dan link streaming dengan mudah untuk format M3U.</p>
        </div>

        <!-- Form Input -->
        <div class="space-y-4 bg-slate-950 p-4 rounded-xl border border-slate-800">
            <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Tambah / Edit Film Baru</h2>
            
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Judul Film</label>
                <input type="text" id="inputJudul" placeholder="Contoh: Minions & Monsters (2026)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Link Logo (URL Gambar)</label>
                <input type="text" id="inputLogo" placeholder="Contoh: https://media.themoviedb.org/.../image.jpg" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Link Streaming (.m3u8 / .mpd)</label>
                <input type="text" id="inputStream" placeholder="Contoh: https://live.playerp2p.online/.../master.m3u8" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Grup Title (Opsional)</label>
                <input type="text" id="inputGroup" value="Film" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
            </div>

            <button onclick="tambahFilm()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold py-2.5 rounded-lg transition text-sm cursor-pointer shadow-md">
                + Tambahkan ke Daftar M3U
            </button>
        </div>

        <!-- Output Hasil M3U -->
        <div class="space-y-2">
            <div class="flex justify-between items-center">
                <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Hasil Kode M3U</label>
                <span id="counter" class="text-xs text-amber-400 font-medium">0 Film Ditambahkan</span>
            </div>
            
            <textarea id="outputResult" readonly class="w-full h-48 bg-slate-950 border border-slate-800 rounded-xl p-3 font-mono text-xs text-slate-300 focus:outline-none resize-none">#EXTM3U</textarea>
            
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="salinKode()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 rounded-lg transition text-xs cursor-pointer border border-slate-700">
                    📋 Salin Kode
                </button>
                <button onclick="downloadFile()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg transition text-xs cursor-pointer shadow-md">
                    💾 Download .m3u
                </button>
            </div>
        </div>

        <!-- Tombol Reset/Hapus Semua -->
        <div class="text-center pt-2">
            <button onclick="resetData()" class="text-xs text-rose-400 hover:text-rose-300 underline cursor-pointer">
                Reset / Kosongkan Daftar
            </button>
        </div>
    </div>

    <!-- Custom Notification Box -->
    <div id="toast" class="fixed bottom-5 bg-slate-800 text-white text-xs px-4 py-2 rounded-lg shadow-lg border border-slate-700 transition-all opacity-0 pointer-events-none transform translate-y-4">
        Berhasil disalin ke clipboard!
    </div>

    <script>
        // Data default (hanya dipakai jika belum ada data tersimpan)
        const defaultFilmData = [
            {
                judul: "Minions & Monsters (2026)",
                logo: "https://media.themoviedb.org/t/p/w260_and_h390_face/nz7i42yhLIJ4ve9JKgM6NthoLHO.jpg",
                stream: "https://live.playerp2p.online/hlsmod/p16-ad-site-sign-sg.tiktokcdn.com/A_0bDZB3EcBkL_gRzRCU3w/luy/b6iuxe9u/i3tkc8/tt/master.m3u8?v=1766826492",
                group: "Film"
            },
            {
                judul: "The Matrix Reloaded",
                logo: "https://media.themoviedb.org/t/p/w188_and_h282_face/aA5qHS0FbSXO8PxcxUIHbDrJyuh.jpg",
                stream: "https://playcdn.de/zzz/d0716bf9c93aa4788c60ee40745111b740eac476/21/480.m3u8",
                group: "Film"
            },
            {
                judul: "The Matrix Reloaded",
                logo: "https://media.themoviedb.org/t/p/w188_and_h282_face/bkkS61w94ZVMNVd8KEyyJl2tnY5.jpg",
                stream: "https://sacdn.hakunaymatata.com/dash/5539572850610298200_0_0_1080_h265_855/index_web.mpd",
                group: "Film"
            }
        ];

        // Ambil data dari localStorage, atau gunakan data default jika kosong
        let daftarFilm = JSON.parse(localStorage.getItem('m3uData')) || defaultFilmData;

        function renderM3U() {
            let hasil = "#EXTM3U\n\n";
            daftarFilm.forEach(f => {
                hasil += `#EXTINF:-1 tvg-name="${f.judul}" tvg-logo="${f.logo}" group-title="${f.group}",${f.judul}\n`;
                hasil += `${f.stream}\n\n`;
            });
            
            document.getElementById('outputResult').value = hasil.trim();
            document.getElementById('counter').innerText = `${daftarFilm.length} Film Ditambahkan`;

            // Auto-save: Simpan daftarFilm ke localStorage setiap kali di-render
            localStorage.setItem('m3uData', JSON.stringify(daftarFilm));
        }

        function tambahFilm() {
            let judul = document.getElementById('inputJudul').value.trim();
            let logo = document.getElementById('inputLogo').value.trim();
            let stream = document.getElementById('inputStream').value.trim();
            let group = document.getElementById('inputGroup').value.trim() || "Film";

            if (!judul || !stream) {
                showToast("Judul dan Link Streaming wajib diisi!");
                return;
            }

            daftarFilm.push({ judul, logo, stream, group });
            renderM3U();

            // Reset input form
            document.getElementById('inputJudul').value = "";
            document.getElementById('inputLogo').value = "";
            document.getElementById('inputStream').value = "";
            showToast("Film berhasil ditambahkan ke daftar!");
        }

        function salinKode() {
            let textarea = document.getElementById('outputResult');
            textarea.select();
            
            // Fallback copy aman untuk iFrame / mobile
            try {
                document.execCommand('copy');
                showToast("Berhasil disalin ke clipboard!");
            } catch (err) {
                showToast("Gagal menyalin otomatis.");
            }
        }

        function downloadFile() {
            let text = document.getElementById('outputResult').value;
            let blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'playlist_film.m3u';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("File .m3u berhasil diunduh!");
        }

        function resetData() {
            if (confirm("Yakin ingin mengosongkan daftar film?")) {
                daftarFilm = [];
                renderM3U(); // renderM3U() juga akan menimpa localStorage menjadi kosong
                showToast("Daftar dikosongkan.");
            }
        }

        function showToast(pesan) {
            let toast = document.getElementById('toast');
            toast.innerText = pesan;
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2000);
        }

        // Jalankan render awal saat halaman dimuat
        window.onload = function() {
            renderM3U();
        }
    </script>
</body>
</html>
