<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player M3U</title>
    
    <meta name="theme-color" content="#090d16">
    <link rel="manifest" id="my-manifest">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3334/3334886.png">
    
    <!-- HLS.js untuk memutar format .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center sticky top-0 z-20">
        <div class="flex items-center gap-2">
            <span class="text-xl">🎬</span>
            <h1 class="font-bold text-base tracking-tight text-amber-400">IPTV Film Player</h1>
        </div>
        <div class="flex gap-2">
            <button id="btnInstall" class="hidden bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-md cursor-pointer">
                📥 Install
            </button>
            <button onclick="bukaModalImport()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700 cursor-pointer">
                📂 Muat M3U
            </button>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 flex flex-col md:flex-row max-w-7xl w-full mx-auto p-4 gap-4">
        
        <!-- Kolom Pemutar Video (Player Section) -->
        <div class="w-full md:w-7/12 flex flex-col space-y-3">
            <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-xl flex items-center justify-center">
                <video id="videoPlayer" controls autoplay class="w-full h-full object-contain"></video>
                <div id="playerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 text-slate-400 text-center p-6 space-y-2">
                    <span class="text-4xl">▶️</span>
                    <p class="text-sm font-medium">Pilih film dari daftar di samping untuk mulai menonton</p>
                </div>
            </div>
            
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-1">
                <span id="nowGroup" class="text-[10px] uppercase font-bold tracking-wider text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded">Film</span>
                <h2 id="nowTitle" class="text-lg font-bold text-slate-100 mt-1">Belum ada film yang diputar</h2>
                <p id="nowLink" class="text-xs text-slate-500 truncate font-mono">-</p>
            </div>
        </div>

        <!-- Kolom Daftar Film (Playlist Section) -->
        <div class="w-full md:w-5/12 flex flex-col bg-slate-900 border border-slate-800 rounded-2xl p-4 h-[500px] md:h-auto overflow-hidden">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Daftar Playlist</h3>
                <span id="playlistCount" class="text-xs text-amber-400 font-medium">0 Film</span>
            </div>

            <!-- Kolom Pencarian -->
            <div class="mb-3">
                <input type="text" id="searchFilm" placeholder="Cari judul film..." oninput="filterFilm()" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-amber-400 text-slate-200">
            </div>

            <!-- List Film Scrollable -->
            <div id="filmListContainer" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <!-- Data akan dimasukkan secara dinamis via JavaScript -->
            </div>
        </div>
    </main>

    <!-- Modal Import M3U / Tambah Manual -->
    <div id="modalImport" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-sm text-amber-400">Import atau Edit Playlist M3U</h3>
                <button onclick="tutupModalImport()" class="text-slate-400 hover:text-white text-sm cursor-pointer font-bold">✕</button>
            </div>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Tempel Teks Format M3U di Sini:</label>
                    <textarea id="inputRawM3U" rows="8" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 font-mono text-xs text-slate-300 focus:outline-none resize-none" placeholder="#EXTM3U&#10;#EXTINF:-1 tvg-name=..."></textarea>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                <button onclick="tutupModalImport()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-xs font-medium cursor-pointer">Batal</button>
                <button onclick="prosesImportM3U()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-lg text-xs font-bold cursor-pointer shadow-md">Muat Playlist</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2 rounded-lg shadow-lg border border-slate-700 transition-all opacity-0 pointer-events-none transform translate-y-4 z-50">
        Pesan notifikasi
    </div>

    <script>
        // 1. Konfigurasi PWA Manifest & Install Prompt
        const manifestData = {
            "name": "IPTV Film Player",
            "short_name": "IPTV Player",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#090d16",
            "theme_color": "#090d16",
            "icons": [{ "src": "https://cdn-icons-png.flaticon.com/512/3334/3334886.png", "sizes": "512x512", "type": "image/png" }]
        };
        const blobManifest = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        document.getElementById('my-manifest').setAttribute('href', URL.createObjectURL(blobManifest));

        let deferredPrompt;
        const btnInstall = document.getElementById('btnInstall');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstall.classList.remove('hidden');
        });
        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') btnInstall.classList.add('hidden');
                deferredPrompt = null;
            }
        });

                // 2. Data Playlist (Otomatis dari GitHub)
        let daftarFilm = [];
        // Gunakan link Raw standar yang lebih stabil
        const GITHUB_M3U_URL = "https://raw.githubusercontent.com/Mangx1/vod/main/Cobss";

        let currentHls = null;

        // 3. Fungsi Menarik Data Playlist dari GitHub
        async function muatPlaylistDariGitHub() {
            let container = document.getElementById('filmListContainer');
            container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6 animate-pulse">Mengambil data dari GitHub...</p>`;

            try {
                // Cukup gunakan timestamp untuk menembus cache, TANPA custom headers
                const antiCacheURL = GITHUB_M3U_URL + "?t=" + new Date().getTime();
                
                const response = await fetch(antiCacheURL, {
                    cache: 'no-store'
                });

                
                if (!response.ok) throw new Error("Gagal terhubung ke GitHub");
                
                const rawM3U = await response.text();
                
                let lines = rawM3U.split('\n');
                let parsed = [];
                let currentFilm = {};

                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        currentFilm = {};
                        let lastComma = line.lastIndexOf(',');
                        if (lastComma !== -1) {
                            currentFilm.judul = line.substring(lastComma + 1).trim();
                        }
                        let logoMatch = line.match(/tvg-logo="([^"]*)"/);
                        if (logoMatch) currentFilm.logo = logoMatch[1];
                        
                        let groupMatch = line.match(/group-title="([^"]*)"/);
                        if (groupMatch) currentFilm.group = groupMatch[1];
                    } else if (line && !line.startsWith('#')) {
                        currentFilm.stream = line;
                        if (currentFilm.judul && currentFilm.stream) {
                            parsed.push({
                                judul: currentFilm.judul,
                                logo: currentFilm.logo || "",
                                stream: currentFilm.stream,
                                group: currentFilm.group || "Film"
                            });
                        }
                    }
                }

                if (parsed.length > 0) {
                    daftarFilm = parsed;
                    renderPlaylist();
                    showToast(`Berhasil memuat ${parsed.length} film dari GitHub!`);
                } else {
                    container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">Tidak ada film di dalam file GitHub.</p>`;
                    document.getElementById('playlistCount').innerText = `0 Film`;
                }

            } catch (error) {
                console.error("Error Fetch:", error);
                container.innerHTML = `<p class="text-xs text-red-500 text-center py-6">Gagal memuat playlist otomatis. Silakan muat manual melalui tombol 'Muat M3U'.</p>`;
                showToast("Gagal mengambil data dari GitHub.");
            }
        }

        function renderPlaylist(data = daftarFilm) {
            let container = document.getElementById('filmListContainer');
            container.innerHTML = "";
            
            if (data.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">Tidak ada film ditemukan.</p>`;
                document.getElementById('playlistCount').innerText = `0 Film`;
                return;
            }

            data.forEach((film, index) => {
                let card = document.createElement('div');
                card.className = "flex items-center gap-3 bg-slate-950/60 hover:bg-slate-800/80 border border-slate-800/80 p-2.5 rounded-xl cursor-pointer transition";
                card.onclick = () => putarFilm(film);

                let logoImg = film.logo ? film.logo : "https://via.placeholder.com/60x90?text=No+Image";

                card.innerHTML = `
                    <img src="${logoImg}" class="w-10 h-14 object-cover rounded-lg bg-slate-800 shrink-0" onerror="this.src='https://via.placeholder.com/60x90?text=Error'">
                    <div class="flex-1 min-w-0">
                        <span class="text-[9px] text-amber-400 font-semibold uppercase">${film.group || 'Film'}</span>
                        <h4 class="text-xs font-semibold text-slate-200 truncate">${film.judul}</h4>
                        <p class="text-[10px] text-slate-500 truncate mt-0.5">${film.stream}</p>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('playlistCount').innerText = `${data.length} Film`;
        }

        function putarFilm(film) {
            let video = document.getElementById('videoPlayer');
            let placeholder = document.getElementById('playerPlaceholder');
            
            placeholder.classList.add('hidden');
            document.getElementById('nowTitle').innerText = film.judul;
            document.getElementById('nowGroup').innerText = film.group || 'Film';
            document.getElementById('nowLink').innerText = film.stream;

            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }

            if (film.stream.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    currentHls = new Hls();
                    currentHls.loadSource(film.stream);
                    currentHls.attachMedia(video);
                    currentHls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = film.stream;
                    video.addEventListener('loadedmetadata', () => video.play());
                }
            } else {
                // Untuk format MPD / MP4 langsung
                video.src = film.stream;
                video.play().catch(e => showToast("Gagal memutar media langsung."));
            }
            showToast(`Memutar: ${film.judul}`);
        }

        function filterFilm() {
            let keyword = document.getElementById('searchFilm').value.toLowerCase();
            let hasil = daftarFilm.filter(f => f.judul.toLowerCase().includes(keyword));
            renderPlaylist(hasil);
        }

        function bukaModalImport() {
            let textM3U = "#EXTM3U\n\n";
            daftarFilm.forEach(f => {
                textM3U += `#EXTINF:-1 tvg-name="${f.judul}" tvg-logo="${f.logo}" group-title="${f.group}",${f.judul}\n`;
                textM3U += `${f.stream}\n\n`;
            });
            document.getElementById('inputRawM3U').value = textM3U.trim();
            document.getElementById('modalImport').classList.remove('hidden');
        }

        function tutupModalImport() {
            document.getElementById('modalImport').classList.add('hidden');
        }

        function prosesImportM3U() {
            let raw = document.getElementById('inputRawM3U').value;
            let lines = raw.split('\n');
            let parsed = [];
            let currentFilm = {};

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    currentFilm = {};
                    // Ekstrak Judul setelah koma terakhir
                    let lastComma = line.lastIndexOf(',');
                    if (lastComma !== -1) {
                        currentFilm.judul = line.substring(lastComma + 1).trim();
                    }
                    // Ekstrak Logo
                    let logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    if (logoMatch) currentFilm.logo = logoMatch[1];
                    
                    // Ekstrak Group
                    let groupMatch = line.match(/group-title="([^"]*)"/);
                    if (groupMatch) currentFilm.group = groupMatch[1];
                } else if (line && !line.startsWith('#')) {
                    currentFilm.stream = line;
                    if (currentFilm.judul && currentFilm.stream) {
                        parsed.push({
                            judul: currentFilm.judul,
                            logo: currentFilm.logo || "",
                            stream: currentFilm.stream,
                            group: currentFilm.group || "Film"
                        });
                    }
                }
            }

            if (parsed.length > 0) {
                daftarFilm = parsed;
                renderPlaylist();
                tutupModalImport();
                showToast(`Berhasil memuat ${parsed.length} film!`);
            } else {
                showToast("Format M3U tidak valid.");
            }
        }

        function showToast(pesan) {
            let toast = document.getElementById('toast');
            toast.innerText = pesan;
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2000);
        }

        window.onload = function() {
            // Menarik dan merender data otomatis dari GitHub saat web dibuka
            muatPlaylistDariGitHub();
        }
    </script>
</body>
</html>
